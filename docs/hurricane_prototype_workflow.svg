<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
  <title id="title">Hurricane Winds audit prototype: intended ModelBuilder connections</title>
  <desc id="desc">Preparation and reference grid are independent stages. Their Prepare Manifest and Grid Spec outputs connect to Validate Prototype. This is a workflow design diagram, not an export of a saved ArcGIS model.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#466477"/></marker></defs>
  <rect width="1100" height="660" fill="#f7fafc"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#17384c">
    <text x="50" y="48" font-size="27" font-weight="700">Hurricane Winds · audit prototype</text>
    <text x="50" y="78" font-size="16">Workflow design · three Script Tools · spatial wind estimation deferred</text>
    <g stroke="#466477" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M245 159 V202"/><path d="M245 280 V323"/>
      <path d="M810 159 V202"/><path d="M810 280 V323"/>
      <path d="M245 390 V440 H445 V470"/><path d="M810 390 V440 H655 V470"/>
      <path d="M550 535 V575"/>
    </g>
    <g fill="#e6f0f8" stroke="#6d91ad" stroke-width="1.5">
      <rect x="65" y="110" width="360" height="49" rx="24"/>
      <rect x="630" y="110" width="360" height="49" rx="24"/>
    </g>
    <g text-anchor="middle" font-size="16">
      <text x="245" y="140">IBTrACS points · 1955–2025 MAIN</text>
      <text x="810" y="140">Natural Earth PRI or replacement polygon</text>
    </g>
    <g fill="#ffdf86" stroke="#a37b21" stroke-width="1.5">
      <rect x="65" y="202" width="360" height="78" rx="8"/>
      <rect x="630" y="202" width="360" height="78" rx="8"/>
      <rect x="370" y="470" width="360" height="65" rx="8"/>
    </g>
    <g text-anchor="middle">
      <text x="245" y="231" font-size="20" font-weight="600">Prepare Hurricane Data</text>
      <text x="245" y="257" font-size="15">USA positions + wind · preserve flags and nulls</text>
      <text x="810" y="231" font-size="20" font-weight="600">Establish Reference Grid</text>
      <text x="810" y="257" font-size="15">EPSG:32161 · 250 m · anchor (0,0)</text>
      <text x="550" y="510" font-size="20" font-weight="600">Validate Prototype</text>
    </g>
    <g fill="#e4f1e7" stroke="#72987b" stroke-width="1.5">
      <rect x="65" y="323" width="360" height="67" rx="24"/>
      <rect x="630" y="323" width="360" height="67" rx="24"/>
      <rect x="370" y="575" width="360" height="42" rx="21"/>
    </g>
    <g text-anchor="middle" font-size="16">
      <text x="245" y="350" font-weight="600">Prepare Manifest</text>
      <text x="245" y="374">Points · CSV · storm/QC tables · provenance</text>
      <text x="810" y="350" font-weight="600">Grid Spec</text>
      <text x="810" y="374">Reference raster · land mask · boundary</text>
      <text x="550" y="602">Validation report + Passed</text>
    </g>
    <text x="50" y="645" font-size="13" fill="#526a79">Provisional generalized boundary. A 250 m computational grid does not imply 250 m historical wind accuracy.</text>
  </g>
</svg>
